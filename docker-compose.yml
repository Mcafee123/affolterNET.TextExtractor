version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: backend/affolterNET.TextExtractor.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      # Override with actual storage credentials
      - StorageAccountName=${STORAGE_ACCOUNT_NAME:-placeholder-storage-account}
      - StorageAccountKey=${STORAGE_ACCOUNT_KEY:-placeholder-storage-key}
    volumes:
      # Mount logs directory for local development
      - ./backend/affolterNET.TextExtractor.Web/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: textextractor-network
